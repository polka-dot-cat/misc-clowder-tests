name: misc-test-defaults

defaults:
  source: chromium
  git:
    submodules: recursive

sources:
  chromium:
    url: chromium.googlesource.com
    protocol: https
  sourceforge:
    url: git.code.sf.net
    protocol: https

clowder:
  - name: polka-dot-cat/djinni
    source: github
    groups: [third-party]
    upstream:
      name: dropbox/djinni
      source: github
  - name: polka-dot-cat/gyp
    source: github
    branch: fork-branch
    groups: [third-party]
    upstream:
      name: external/gyp
      source: chromium
  - name: polka-dot-cat/sox
    source: github
    groups: [third-party]
    upstream:
      name: p/sox/code
      source: sourceforge
